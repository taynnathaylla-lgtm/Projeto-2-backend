
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}Biblioteca IESB{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        nav a {
            margin-right: 1rem;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 6px 10px;
            text-align: left;
        }

        .msg {
            padding: 8px 12px;
            margin: 8px 0;
            border-radius: 4px;
        }

        .msg.success {
            background: #d4edda;
        }

        .msg.error {
            background: #f8d7da;
        }

        .msg.warning {
            background: #fff3cd;
        }
    </style>
</head>

<body>

    <nav>
        <a href="{% url 'lista_livros' %}">Livros</a>
        <a href="{% url 'relatorio_livros' %}">Relatório</a>
        <a href="/admin/">Admin</a>
    </nav>

    <hr>

    {% for message in messages %}
        <div class="msg {{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}

    {% block conteudo %}
    {% endblock %}

</body>

</html>
